<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kvadratiske figurtall</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0fdfa;--panel:#fff;--border:#cdeee8;
  --accent:#0d9488;--accent-dark:#0f766e;--green:#16a34a;--red:#dc2626;
  --yellow:#f59e0b;--muted:#6b7280;--text:#1e293b;
  --cell:#60a5fa;--cell-edge:#2563eb;
  --r:14px;--shadow:0 2px 14px rgba(0,0,0,0.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}

/* HEADER */
.header{background:var(--accent);color:white;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 2px 12px rgba(13,148,136,0.3);}
.header-left h1{font-size:1rem;font-weight:900;}
.header-left p{font-size:0.7rem;opacity:0.85;font-weight:700;}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
.badge{padding:3px 12px;border-radius:20px;font-size:0.8rem;font-weight:800;}
.level-badge{background:rgba(255,255,255,0.2);color:white;}
.score-badge{background:var(--yellow);color:#78350f;}
.btn-menu{padding:4px 12px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.4);border-radius:6px;color:white;font-size:0.75rem;font-weight:700;text-decoration:none;}

/* START */
.overlay{position:fixed;inset:0;background:rgba(240,253,250,0.97);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
.start-card{background:white;border:2px solid var(--border);border-radius:16px;padding:30px 32px;width:480px;max-width:100%;text-align:center;box-shadow:var(--shadow);}
.start-card h1{font-size:1.4rem;color:var(--accent);margin-bottom:4px;}
.start-card p{font-size:0.88rem;color:var(--muted);font-weight:700;margin-bottom:14px;line-height:1.5;}
.version{font-size:0.65rem;color:var(--muted);font-family:monospace;margin-bottom:12px;}
.lbl{font-size:0.72rem;color:var(--muted);margin-bottom:6px;font-weight:800;}
.level-select{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:6px;}
.level-btn{width:38px;height:38px;border:2px solid var(--border);border-radius:8px;background:white;font-family:'Nunito',sans-serif;font-weight:900;font-size:0.85rem;cursor:pointer;color:var(--muted);}
.level-btn.active{background:var(--accent);border-color:var(--accent);color:white;}
.level-desc{font-size:0.8rem;color:var(--accent);font-weight:800;margin-bottom:12px;min-height:18px;}
.mode-row{display:flex;gap:8px;margin-bottom:10px;}
.mode-btn{flex:1;padding:8px;background:white;border:2px solid var(--border);border-radius:8px;color:var(--muted);font-family:'Nunito',sans-serif;font-size:0.8rem;font-weight:800;cursor:pointer;}
.mode-btn.active{background:var(--accent);border-color:var(--accent);color:white;}
.name-input{width:100%;padding:9px 12px;border:2px solid var(--border);border-radius:8px;font-family:'Nunito',sans-serif;font-size:0.95rem;font-weight:800;outline:none;margin-bottom:10px;text-align:center;text-transform:uppercase;letter-spacing:2px;}
.name-input:focus{border-color:var(--accent);}
.start-btn{width:100%;padding:12px;background:var(--accent);color:white;border:none;border-radius:8px;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;}
.start-btn:hover{background:var(--accent-dark);}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;align-items:center;padding:14px;gap:12px;max-width:900px;margin:0 auto;width:100%;}
.card{width:100%;background:var(--panel);border:2px solid var(--border);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);}
.task-type{font-size:0.75rem;font-weight:800;color:var(--accent);margin-bottom:4px;}
.task-q{font-size:1.05rem;font-weight:800;line-height:1.5;margin-bottom:12px;}
.hintbox{background:#f0fdfa;border:2px solid #5eead4;color:#134e4a;border-radius:12px;padding:10px 14px;font-weight:800;font-size:0.9rem;line-height:1.5;margin-bottom:12px;display:none;}
.hintbox.show{display:block;}

/* FIGURER */
.figs{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-end;margin-bottom:14px;}
.fig{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 12px 8px;border:2px solid var(--border);border-radius:12px;background:#faf9ff;}
.fig.zero{border-style:dashed;border-color:#2dd4bf;background:#f0fdfa;animation:pop .5s ease-out;}
.fig-lbl{font-size:0.8rem;font-weight:800;color:var(--muted);}
.fig svg{display:block;}

/* TABELL MED FORSKJØVET DIFFERANSE */
.tbl-wrap{max-width:100%;overflow-x:auto;margin-bottom:12px;}
.tbl-wrap table{margin:0 auto;}
.sm-lbl{display:none;}
table.dt{border-collapse:collapse;}
table.dt th,table.dt td{border:2px solid var(--border);padding:5px 6px;text-align:center;font-weight:800;min-width:48px;height:44px;}
table.dt th{background:#ccfbf1;color:var(--accent-dark);}
table.dt th.rowh{text-align:left;padding:5px 10px;white-space:nowrap;}
table.dt td.gap,table.dt th.gap{background:#f3f4f6;min-width:34px;}
table.dt td.val{font-size:1.1rem;}
table.dt td.pulse,.pulse{animation:pulse 1s ease-in-out 2;}
@keyframes pulse{0%,100%{box-shadow:none;}50%{box-shadow:0 0 0 4px #fbbf24 inset;}}
@keyframes pop{0%{transform:scale(.6);opacity:0;}100%{transform:scale(1);opacity:1;}}

/* SVAR */
.num-in,.txt-in{padding:7px 8px;border:2px solid var(--border);border-radius:8px;font-family:'Nunito',sans-serif;font-size:1.05rem;font-weight:800;outline:none;text-align:center;}
.num-in{width:58px;}
.txt-in{width:220px;}
.expr-in{width:84px;}
.num-in:focus,.txt-in:focus{border-color:var(--accent);}
.num-in[readonly]{background:#f8fafc;}
.ok{border-color:var(--green)!important;background:#f0fdf4!important;}
.bad{border-color:var(--red)!important;background:#fef2f2!important;}
.step{display:flex;flex-direction:column;align-items:center;gap:8px;margin:8px 0 4px;padding:12px;border:2px solid var(--border);border-radius:12px;background:#fcfbff;animation:pop .35s ease-out;}
.step-title{font-size:0.8rem;font-weight:900;color:var(--accent);letter-spacing:0.5px;}
.eq{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-weight:900;font-size:1.2rem;}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:40px;padding:0 8px;border:2px dashed #2dd4bf;border-radius:8px;background:white;color:var(--accent-dark);}
.slot.filled{border-style:solid;border-color:var(--accent);background:#ccfbf1;animation:pop .3s ease-out;}
.result{color:var(--green);animation:pop .4s ease-out;}
.fade{animation:pop .4s ease-out;}
.sign-btn{width:46px;height:40px;border:2px solid var(--border);border-radius:8px;background:white;font-family:'Nunito',sans-serif;font-size:1.3rem;font-weight:900;cursor:pointer;color:var(--accent-dark);}
.sign-btn:hover{border-color:var(--accent);}
.explain{font-size:0.9rem;font-weight:800;color:#134e4a;text-align:center;line-height:1.5;max-width:560px;}
.flyer{position:fixed;transform:translate(-50%,-50%);z-index:500;background:var(--yellow);color:#78350f;font-weight:900;font-size:1.15rem;padding:5px 12px;border-radius:9px;box-shadow:0 4px 14px rgba(0,0,0,0.25);pointer-events:none;}

/* TILBAKEMELDING */
.fb{margin-top:12px;border-radius:12px;padding:12px 14px;font-weight:800;line-height:1.55;display:none;}
.fb.err{display:block;background:#fef2f2;border:2px solid #fecaca;color:#991b1b;}
.fb.win{display:block;background:#f0fdf4;border:2px solid #86efac;color:#14532d;}
.fb.info{display:block;background:#eef2ff;border:2px solid #c7d2fe;color:#312e81;}
.fb .big{font-size:1.15rem;display:block;margin-bottom:4px;}

/* KONTROLLER */
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.btn{padding:10px 22px;border:none;border-radius:8px;font-family:'Nunito',sans-serif;font-size:0.92rem;font-weight:800;cursor:pointer;}
.btn:disabled{opacity:0.5;cursor:default;}
.btn-check{background:var(--accent);color:white;}
.btn-next{background:var(--green);color:white;}
.btn-soft{background:#f3f4f6;color:var(--muted);}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);padding:10px 22px;border-radius:10px;font-weight:800;font-size:0.9rem;opacity:0;transition:all .3s;z-index:1100;pointer-events:none;max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.success{background:var(--green);color:white;}
.toast.error{background:var(--red);color:white;}
.toast.info{background:var(--accent);color:white;}

@media (max-width:600px){
  .header{padding:8px 12px;}
  .header-left p{display:none;}
  .task-q{font-size:0.98rem;}
  .card{padding:12px 6px;}
  table.dt th,table.dt td{padding:1px 0;min-width:30px;height:36px;border-width:1.5px;}
  table.dt td.gap,table.dt th.gap{min-width:30px;}
  table.dt .num-in{width:29px;padding:5px 0;font-size:0.85rem;border-width:1.5px;}
  table.dt th.rowh{padding:1px 3px!important;font-size:0.66rem!important;}
  .expr-in{width:70px!important;}
  table.dt th.rowh{padding:2px 4px;font-size:0.72rem;}
  .lg-lbl{display:none;} .sm-lbl{display:inline;}
  .num-in{width:40px;padding:6px 2px;font-size:0.98rem;}
  .eq{font-size:1.05rem;gap:6px;}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important;} }
</style>
<script src="../js/spill-utils.js"></script>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- START -->
<div class="overlay" id="startScreen">
  <div class="start-card">
    <div style="font-size:2.6rem">🟩</div>
    <h1>Kvadratiske figurtall</h1>
    <p>Fyll ut tabellen med første- og andredifferanse, finn f<sub>0</sub> og lag formelen for f<sub>n</sub>.</p>
    <div class="version">v1.0</div>
    <div class="lbl">Start på nivå</div>
    <div class="level-select" id="levelSelect"></div>
    <div class="level-desc" id="levelDesc"></div>
    <div class="mode-row">
      <button class="mode-btn active" data-mode="practice" onclick="selectMode('practice')">🧘 Øvemodus</button>
      <button class="mode-btn" data-mode="multi" onclick="selectMode('multi')">🏎️ Flerspiller</button>
    </div>
    <div id="multiOpts" style="display:none">
      <input class="name-input" id="roomInput" placeholder="ROMKODE" maxlength="8" autocomplete="off">
    </div>
    <button class="start-btn" onclick="startGame()">🚀 Start</button>
  </div>
</div>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <h1>🟩 Kvadratiske figurtall</h1>
    <p>Konstant andredifferanse, f₀ og formel</p>
  </div>
  <div class="header-right">
    <span class="badge" id="roomBadge" style="display:none;background:rgba(255,255,255,0.25);color:white;letter-spacing:1px">🏎️ <span id="roomBadgeCode"></span></span>
    <span class="badge level-badge" id="levelBadge">Nivå 1</span>
    <span class="badge score-badge" id="scoreBadge">0 p</span>
    <a class="btn-menu" href="./">← Meny</a>
  </div>
</div>

<div class="main" id="mainArea" style="display:none">
  <div class="card">
    <div class="task-type" id="taskType"></div>
    <div class="task-q" id="taskQ"></div>
    <div class="hintbox" id="hintBox"></div>
    <div class="figs" id="figs"></div>
    <div class="tbl-wrap" id="tblWrap"></div>
    <div id="steps"></div>
    <div class="fb" id="fb"></div>
  </div>
  <div class="controls">
    <button class="btn btn-check" id="checkBtn" onclick="checkAnswer()">✅ Sjekk svar</button>
    <button class="btn btn-soft" id="showBtn" onclick="showSolution()" style="display:none">💡 Vis løsningen</button>
    <button class="btn btn-next" id="nextBtn" onclick="nextTask()" style="display:none">Neste oppgave ➡️</button>
    <button class="btn btn-soft" id="skipBtn" onclick="nextTask()">⏭️ Ny oppgave</button>
  </div>
</div>

<script>
// ═════════════ LOGIKK (ingen DOM) ═════════════
const rint=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const numTxt=v=>{ const r=Math.round(v*1000)/1000; return (r<0?'−':'')+String(Math.abs(r)).replace('.',','); };

// Byggeklosser for figurene
const block=(x0,y0,w,h)=>{const c=[];for(let x=0;x<w;x++)for(let y=0;y<h;y++)c.push({x:x0+x,y:y0+y});return c;};
const stair=(x0,n)=>{const c=[];for(let x=0;x<n;x++)for(let y=0;y<=x;y++)c.push({x:x0+x,y});return c;}; // n(n+1)/2

// Kjente figurer: figur n er et rektangel/kvadrat (eller en trapp) pluss c faste ruter.
// L og B er lengde og høyde skrevet med n. half: trapp = halvparten av L · B.
const SHAPES={
  kvadrat:  {L:'n',    B:'n', half:false, desc:'et kvadrat med side n',                                   draw:n=>block(0,0,n,n)},
  rektangel:{L:'n + 1',B:'n', half:false, desc:'et rektangel som er n + 1 lang og n høy',                  draw:n=>block(0,0,n+1,n)},
  rektangel2:{L:'n + 2',B:'n',half:false, desc:'et rektangel som er n + 2 lang og n høy',                  draw:n=>block(0,0,n+2,n)},
  dobbel:   {L:'2n',   B:'n', half:false, desc:'to kvadrater med side n, altså et rektangel som er 2n lang og n høy', draw:n=>block(0,0,2*n,n)},
  trapp:    {L:'n + 1',B:'n', half:true,  desc:'en trapp, som er halvparten av et rektangel som er n + 1 lang og n høy', draw:n=>stair(0,n)},
};
// Formel med n som tekst → funksjon (godtar n², n^2, 2n, n(n + 1), 3(n+1) osv.)
function parseFormula(str){
  let s=String(str||'').toLowerCase().replace(/\s+/g,'')
    .replace(/[·×⋅]/g,'*').replace(/[−–]/g,'-').replace(/,/g,'.').replace(/ₙ/g,'n')
    .replace(/²/g,'^2').replace(/\^/g,'**');
  s=s.replace(/^f(_?n|\(n\))?=/,'');
  if(!s||!/^[0-9n+\-*/().]+$/.test(s)) return null;
  s=s.replace(/(\d|n|\))(?=[n(])/g,'$1*').replace(/\)(?=\d)/g,')*').replace(/n(?=\d)/g,'n*');
  try{
    const f=new Function('n','"use strict";return ('+s+');');
    if(!Number.isFinite(f(1))) return null;
    return f;
  }catch(e){ return null; }
}
const exprF=s=>parseFormula(s);
const same=(f,g)=>{ for(let n=0;n<=8;n++){ const v=f(n); if(!Number.isFinite(v)||Math.abs(v-g(n))>1e-9) return false; } return true; };

// Lager et mønster. Kjente figurer (nivå 1–7) eller generelle an² + bn + c (nivå 8–9).
function knownPattern(level){
  const ids=level<=2?['kvadrat','kvadrat','rektangel','dobbel']:['kvadrat','rektangel','rektangel2','dobbel','trapp','trapp'];
  const id=pick(ids), sh=SHAPES[id], c=rint(0,level<=2?3:4);
  const L=exprF(sh.L), B=exprF(sh.B);
  return {kind:'known',id,c,f:n=>L(n)*B(n)*(sh.half?0.5:1)+c};
}
function generalPattern(){
  // half: en trapp (½n² + ½n), A hele kvadrater (n²), bc søyler med høyde n (n), c faste ruter
  let half, A, bc, c;
  do{ half=Math.random()<0.4?1:0; A=rint(half?0:1,2); bc=rint(0,3); c=rint(0,4); }while(A+half*0.5<=0||(A+bc+half===1&&c===0));
  const a=A+half*0.5, b=bc+half*0.5;
  return {kind:'general',half,A,bc,c,a,b,f:n=>a*n*n+b*n+c};
}
function patternCells(p,n){
  let cells=[], x=0;
  if(p.kind==='known'){
    cells=SHAPES[p.id].draw(n); x=Math.max(0,...cells.map(q=>q.x+1));
  } else {
    if(p.half){ cells=cells.concat(stair(x,n)); x+=n; }
    for(let i=0;i<p.A;i++){ cells=cells.concat(block(x,0,n,n)); x+=n; }
    for(let i=0;i<p.bc;i++){ cells=cells.concat(block(x,0,1,n)); x+=1; }
  }
  // Faste ruter: en egen rad litt til høyre
  const gap=cells.length?1:0;
  for(let i=0;i<p.c;i++) cells.push({x:x+gap+i,y:0});
  return cells;
}

// Stegene i hver oppgave, per nivå
const STEPS={
  1:['tabell','anim0'],
  2:['tabell','hjelpA','hjelpB'],
  3:['tabell','f0','animFormel'],
  4:['bokser'],
  5:['tabell','f0','bokser'],
  6:['tabell','f0','fri'],
  7:['tabell','f0','fri','ekstra'],
  8:['tabell','f0','abc'],
  9:['tabell','f0','fri','ekstra'],
};
const EXTRA_N=[6,7,8,9,10,15,20];
function makeTask(level){
  const L=Math.min(Math.max(level,1),9);
  const p=L>=8?generalPattern():knownPattern(L);
  const F=[1,2,3,4,5].map(p.f);
  const d=[0,1,2,3].map(i=>F[i+1]-F[i]);
  const D=d[1]-d[0];
  const d0=d[0]-D, f0=F[0]-d0;
  const t={level:L,p,steps:STEPS[L],F,d,D,d0,f0};
  if(L===7||L===9) t.extra=shuffle(EXTRA_N.slice()).slice(0,2).sort((a,b)=>a-b);
  // Koeffisienter for den generelle metoden
  t.a=D/2; t.c=f0; t.b=(F[0]-f0)-t.a;
  return t;
}

// Formel som tekst
function fmtQ(a,b,c){
  let s=(a===1?'':numTxt(a))+'n²';
  if(b) s+=(b>0?' + ':' − ')+(Math.abs(b)===1?'':numTxt(Math.abs(b)))+'n';
  if(c) s+=(c>0?' + ':' − ')+numTxt(Math.abs(c));
  return s;
}
function fmtKnown(p){
  const sh=SHAPES[p.id];
  let s=p.id==='kvadrat'?'n²':p.id==='dobbel'?'2n²':p.id==='trapp'?'n(n + 1) / 2':'n('+sh.L+')';
  return s+(p.c?' + '+p.c:'');
}
const formulaTxt=t=>t.p.kind==='known'?fmtKnown(t.p):fmtQ(t.a,t.b,t.c);
const parseNum=s=>{ const v=String(s||'').trim().replace(/[−–]/g,'-').replace(',','.'); return /^-?\d+(\.\d+)?$/.test(v)?parseFloat(v):NaN; };
const eqN=(a,b)=>Number.isFinite(a)&&Math.abs(a-b)<1e-9;

// ═════════════ SPILL OG VISNING ═════════════
const LEVELS={
  1:{name:'Nivå 1',desc:'Fyll ut tabellen, og se at andredifferansen er konstant'},
  2:{name:'Nivå 2',desc:'Gå baklengs i tabellen og finn f₀'},
  3:{name:'Nivå 3',desc:'Regn ut f₀ selv, og se hvordan formelen leses ut fra figuren'},
  4:{name:'Nivå 4',desc:'Lag formelen: lengde · bredde + f₀'},
  5:{name:'Nivå 5',desc:'Tabell, f₀ og formelen i ruter'},
  6:{name:'Nivå 6',desc:'Tabell, f₀ og hele formelen selv'},
  7:{name:'Nivå 7',desc:'Alt sammen, og regn ut flere figurtall'},
  8:{name:'Nivå 8',desc:'Den generelle metoden: fₙ = an² + bn + c'},
  9:{name:'Nivå 9',desc:'Den generelle metoden selv, og flere figurtall'},
};
const MIN_LEVEL=1, MAX_LEVEL=9;
let currentLevel=1, currentScore=0, gameMode='practice';
let streak=0, errorStreak=0;
let task=null, taskStart=0, tries=0, stepTries=0, done=false, stepIdx=0, busy=false;
let firstWrongCounted=false;
const seenHints=new Set();

// Rapport til læreren
const tcLv=levelTracker(), tcSessionStart=Date.now();
let tcCorrect=0, tcWrong=0;
function syncTC(){
  tcLv.note(currentLevel);
  syncToTimecode('figurtall-kvadratiske',{level:currentLevel,startLevel:tcLv.start,maxLevel:tcLv.max,
    score:currentScore,correct:tcCorrect,wrong:tcWrong,sessionStart:tcSessionStart});
}
const $=id=>document.getElementById(id);
const wait=ms=>new Promise(r=>setTimeout(r,matchMedia('(prefers-reduced-motion: reduce)').matches?Math.min(ms,80):ms));

// ── TEGNING ──
function figSVG(p,n,cs){
  const cells=patternCells(p,n);
  const W=Math.max(1,...cells.map(c=>c.x+1)), H=Math.max(1,...cells.map(c=>c.y+1));
  const pad=2;
  const r=cells.map(c=>`<rect x="${pad+c.x*cs+1}" y="${pad+(H-1-c.y)*cs+1}" width="${cs-2}" height="${cs-2}" rx="2.5" fill="var(--cell)" stroke="var(--cell-edge)" stroke-width="1.3"/>`).join('');
  return `<svg width="${W*cs+pad*2}" height="${H*cs+pad*2}" role="img" aria-label="Figur ${n} med ${cells.length} ruter">${r}</svg>`;
}
function cellSize(p){
  let maxW=1,maxH=1;
  [1,2,3,4,5].forEach(n=>{const c=patternCells(p,n); maxW=Math.max(maxW,...c.map(q=>q.x+1)); maxH=Math.max(maxH,...c.map(q=>q.y+1));});
  const vw=Math.min(window.innerWidth,900);
  const room=vw<600?Math.max(60,(vw-80)/3):Math.max(70,(vw-130)/5);
  return Math.max(5,Math.min(18,Math.floor(room/maxW),Math.floor(130/maxH)));
}

const TABLE_IDS=['f1','f2','f3','f4','f5','d1','d2','d3','d4','D2','D3','D4'];
function lockTable(){ TABLE_IDS.forEach(id=>{const el=$(id); if(el){ el.readOnly=true; el.classList.add('ok'); el.tabIndex=-1; }}); }

function flyTo(fromEl,toEl,text,ms=850){
  return new Promise(res=>{
    if(!fromEl||!toEl||matchMedia('(prefers-reduced-motion: reduce)').matches){ res(); return; }
    const a=fromEl.getBoundingClientRect(), b=toEl.getBoundingClientRect();
    const el=document.createElement('div'); el.className='flyer'; el.textContent=text;
    el.style.left=(a.left+a.width/2)+'px'; el.style.top=(a.top+a.height/2)+'px';
    document.body.appendChild(el);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.style.transition=`left ${ms}ms ease-in-out, top ${ms}ms ease-in-out`;
      el.style.left=(b.left+b.width/2)+'px'; el.style.top=(b.top+b.height/2)+'px';
    }));
    setTimeout(()=>{ el.remove(); res(); },ms+60);
  });
}

async function startStep(){

      busy=true; $('checkBtn').disabled=true;

}

  stepIdx++;

  if(done||busy||!task) return;
  const st=STEP[task.steps[stepIdx]];
  if(!st||st.auto) return;

  if(!res.ok){
    tries++; stepTries++;
    registerWrong();

    if(stepTries>=2) $('showBtn').style.display='';
    return;
  }
  $('fb').className='fb'; $('fb').innerHTML='';
  busy=true; $('checkBtn').disabled=true;
  if(st.after) await st.after();
  busy=false;
  finishStep();
};

  if(done||busy) return;
  const st=STEP[task.steps[stepIdx]];
  if(!st||st.auto) return;
  st.solve(); st.check();
  task.usedSolution=true;
  $('fb').className='fb info'; $('fb').innerHTML='💡 Her er løsningen på dette steget.';
  busy=true; $('checkBtn').disabled=true; $('showBtn').style.display='none';
  if(st.after) await st.after();
  busy=false;
  finishStep();
};
function registerWrong(){
  tcWrong++;
  if(!firstWrongCounted){ firstWrongCounted=true; SU.recordResult(false); }
  syncTC();
}
function completeTask(){
  done=true;
  $('checkBtn').style.display='none'; $('showBtn').style.display='none'; $('skipBtn').style.display='none';
  const t=task;
  let msg;
  if(t.usedSolution){
    msg='<span class="big">💡 Oppgaven er ferdig</span>Prøv en ny oppgave på egen hånd.';
  } else {
    const elapsed=(Date.now()-taskStart)/1000;
    const base=110+t.level*25+t.steps.length*10;
    const bonus=Math.max(10,Math.round(Math.max(30,base-elapsed*0.5)-tries*15));
    currentScore+=bonus; $('scoreBadge').textContent=currentScore+' p';
    tcCorrect++;
    if(tries===0) SU.recordResult(true);
    syncTC();
    if(gameMode==='multi') syncRoomScore(currentScore);
    msg=`<span class="big">⭐ Riktig! +${bonus} poeng</span>f<sub>n</sub> = ${formulaTxt(t)}`+
      (t.extra?' · '+t.extra.map(n=>`f<sub>${n}</sub> = ${numTxt(t.p.f(n))}`).join(' · '):'');
  }
  $('fb').className='fb '+(t.usedSolution?'info':'win'); $('fb').innerHTML=msg;
  $('nextBtn').style.display=''; $('nextBtn').focus();
}

window.nextTask=function(){
  if(busy) return;
  task=makeTask(currentLevel);
  renderTask();
};
function selectLevelDesc(){ $('levelDesc').textContent=LEVELS[currentLevel].desc; }
window.startGame=function(){
  if(gameMode==='multi'){
    const rc=$('roomInput').value.trim().toUpperCase();
    if(!rc){ showToast('Skriv inn romkoden','error'); return; }
    initRoom(rc);
  }
  $('levelBadge').textContent=LEVELS[currentLevel].name;
  $('startScreen').style.display='none';
  $('mainArea').style.display='flex';
  nextTask();
  syncTC();
};
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||$('mainArea').style.display==='none') return;
  if(e.target&&e.target.tagName==='BUTTON') return;
  if(done) nextTask(); else checkAnswer();
});
buildLevelSelect();
$('levelSelect').addEventListener('click',selectLevelDesc);
selectLevelDesc();
</script>
