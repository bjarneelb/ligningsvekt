<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lærerside – Likningsspill</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f4ff;
    --panel: #ffffff;
    --border: #d0d8f0;
    --accent: #5b4fcf;
    --accent2: #e84393;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #eab308;
    --text: #1e1b4b;
    --muted: #6b7280;
    --shadow: 0 4px 24px rgba(91,79,207,0.10);
    --r: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── HEADER ── */
  .header {
    width: 100%;
    background: var(--accent);
    color: white;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(91,79,207,0.25);
  }
  .header-title { font-size: 1.3rem; font-weight: 900; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .btn-logout {
    padding: 6px 16px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    color: white;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.82rem;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-logout:hover { background: rgba(255,255,255,0.25); }
  .btn-menu {
    padding: 6px 16px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    color: white;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.82rem;
    cursor: pointer;
    text-decoration: none;
  }

  /* ── LOGIN SCREEN ── */
  #loginScreen {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #4338ca, #7c3aed 60%, #e84393);
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
  }
  .login-card {
    background: white;
    border-radius: 24px;
    padding: 48px 44px;
    width: 380px;
    text-align: center;
    box-shadow: 0 24px 64px rgba(0,0,0,0.3);
  }
  .login-icon { font-size: 3rem; margin-bottom: 10px; }
  .login-card h1 { font-size: 1.7rem; font-weight: 900; color: var(--accent); margin-bottom: 6px; }
  .login-card p { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
  .login-input {
    width: 100%; padding: 12px 16px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem; font-weight: 700;
    text-align: center;
    outline: none; margin-bottom: 14px;
  }
  .login-input:focus { border-color: var(--accent); }
  .btn-login {
    width: 100%; padding: 13px;
    background: var(--accent); color: white;
    border: none; border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800; font-size: 1rem;
    cursor: pointer; transition: background 0.15s;
  }
  .btn-login:hover { background: #4338ca; }
  .login-error {
    color: var(--red); font-size: 0.85rem;
    font-weight: 700; margin-top: 10px; display: none;
  }

  /* ── MAIN ── */
  .main {
    width: 100%; max-width: 860px;
    padding: 28px 20px 48px;
    display: flex; flex-direction: column; gap: 20px;
  }

  /* ── PAGE TITLE ── */
  .page-title {
    font-size: 1.4rem; font-weight: 900; color: var(--text);
    display: flex; align-items: center; gap: 10px;
  }
  .page-sub { font-size: 0.85rem; color: var(--muted); font-weight: 600; margin-top: 2px; }

  /* ── TOOLBAR ── */
  .toolbar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .btn-danger {
    padding: 9px 20px;
    background: var(--red); color: white;
    border: none; border-radius: 10px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800; font-size: 0.88rem;
    cursor: pointer; transition: filter 0.15s;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-danger:hover { filter: brightness(0.9); }
  .btn-danger:disabled { opacity: 0.4; cursor: not-allowed; filter: none; }
  .select-all-wrap {
    display: flex; align-items: center; gap: 8px;
    font-weight: 700; font-size: 0.88rem; cursor: pointer;
    color: var(--muted);
  }
  .select-all-wrap input { cursor: pointer; width: 16px; height: 16px; }
  .rooms-count {
    margin-left: auto;
    font-size: 0.82rem; font-weight: 700; color: var(--muted);
  }

  /* ── ROOM CARD ── */
  .room-card {
    background: white;
    border-radius: var(--r);
    border: 2px solid var(--border);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .room-card.selected { border-color: var(--accent); }
  .room-header {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 20px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .room-header:hover { background: #f8f8ff; }
  .room-check { flex-shrink: 0; width: 18px; height: 18px; cursor: pointer; }
  .room-code {
    font-family: monospace; font-size: 1.2rem; font-weight: 900;
    color: var(--accent); letter-spacing: 2px; flex-shrink: 0;
    min-width: 90px;
  }
  .room-meta { flex: 1; }
  .room-player-count {
    font-weight: 800; font-size: 0.9rem; color: var(--text);
  }
  .room-last-active {
    font-size: 0.78rem; color: var(--muted); font-weight: 600;
  }
  .room-leader {
    font-size: 0.82rem; font-weight: 700;
    color: var(--green); display: flex; align-items: center; gap: 4px;
  }
  .room-chevron {
    font-size: 1rem; color: var(--muted);
    transition: transform 0.2s; flex-shrink: 0;
  }
  .room-chevron.open { transform: rotate(90deg); }

  /* ── ROOM DETAIL ── */
  .room-detail {
    border-top: 1px solid var(--border);
    padding: 0 20px;
    max-height: 0; overflow: hidden;
    transition: max-height 0.3s ease, padding 0.3s ease;
  }
  .room-detail.open {
    max-height: 600px;
    padding: 16px 20px;
  }

  /* PLAYER TABLE */
  .player-table { width: 100%; border-collapse: collapse; }
  .player-table th {
    font-size: 0.72rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); text-align: left;
    padding: 6px 10px; border-bottom: 2px solid var(--border);
  }
  .player-table td {
    padding: 8px 10px;
    font-size: 0.88rem; font-weight: 700;
    border-bottom: 1px solid #f3f4f6;
  }
  .player-table tr:last-child td { border-bottom: none; }
  .player-table tr.is-leader td { color: var(--accent); }
  .pos-medal { font-size: 1rem; }
  .score-pill {
    background: #f0f4ff; color: var(--accent);
    border-radius: 20px; padding: 2px 10px;
    font-size: 0.8rem;
  }
  .is-leader .score-pill { background: var(--accent); color: white; }
  .active-dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; margin-right: 5px;
  }
  .active-dot.active   { background: var(--green); }
  .active-dot.inactive { background: var(--muted); }

  /* ROOM ACTIONS */
  .room-actions {
    display: flex; gap: 10px; margin-top: 14px;
    padding-top: 14px; border-top: 1px solid var(--border);
  }
  .btn-close-room {
    padding: 8px 18px;
    background: #fef2f2; color: var(--red);
    border: 2px solid #fecaca;
    border-radius: 10px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800; font-size: 0.85rem;
    cursor: pointer; transition: background 0.15s;
  }
  .btn-close-room:hover { background: #fee2e2; }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center; padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
  .empty-state p { font-size: 1rem; font-weight: 700; }
  .empty-state small { font-size: 0.85rem; }

  /* ── CONFIRM DIALOG ── */
  #confirmOverlay {
    position: fixed; inset: 0; z-index: 900;
    background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center;
  }
  #confirmOverlay.show { display: flex; }
  .confirm-card {
    background: white; border-radius: 20px;
    padding: 36px 40px; width: 380px; text-align: center;
    box-shadow: 0 24px 64px rgba(0,0,0,0.25);
  }
  .confirm-icon { font-size: 2.5rem; margin-bottom: 10px; }
  .confirm-card h2 { font-size: 1.3rem; font-weight: 900; margin-bottom: 8px; }
  .confirm-card p { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; line-height: 1.5; }
  .confirm-btns { display: flex; gap: 10px; }
  .btn-confirm-cancel {
    flex: 1; padding: 11px;
    background: #f3f4f6; color: var(--text);
    border: none; border-radius: 10px;
    font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.9rem;
    cursor: pointer;
  }
  .btn-confirm-ok {
    flex: 1; padding: 11px;
    background: var(--red); color: white;
    border: none; border-radius: 10px;
    font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.9rem;
    cursor: pointer;
  }

  /* ── LOADING ── */
  .loading {
    text-align: center; padding: 40px;
    color: var(--muted); font-weight: 700;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* ── TOAST ── */
  .toast {
    position: fixed; top: 20px; left: 50%;
    transform: translateX(-50%) translateY(-80px);
    padding: 12px 24px; border-radius: 50px;
    font-weight: 800; font-size: 0.95rem; color: white;
    z-index: 500; transition: transform 0.4s cubic-bezier(.34,1.56,.64,1);
    pointer-events: none; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { background: var(--green); }
  .toast.error   { background: var(--red); }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- CONFIRM DIALOG -->
<div id="confirmOverlay">
  <div class="confirm-card">
    <div class="confirm-icon">⚠️</div>
    <h2 id="confirmTitle">Avslutt rom?</h2>
    <p id="confirmText">Dette vil fjerne alle spillere fra rommet. Handlingen kan ikke angres.</p>
    <div class="confirm-btns">
      <button class="btn-confirm-cancel" onclick="closeConfirm()">Avbryt</button>
      <button class="btn-confirm-ok" id="confirmOkBtn">Avslutt</button>
    </div>
  </div>
</div>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-icon">🔐</div>
    <h1>Lærerside</h1>
    <p>Logg inn for å se og administrere aktive spillrom</p>
    <input class="login-input" type="password" id="passwordInput"
           placeholder="Passord" onkeydown="if(event.key==='Enter') doLogin()">
    <button class="btn-login" onclick="doLogin()">Logg inn</button>
    <div class="login-error" id="loginError">Feil passord – prøv igjen</div>
  </div>
</div>

<!-- HEADER -->
<div class="header">
  <div class="header-title">🏫 Lærerside – Likningsspill</div>
  <div class="header-right">
    <a class="btn-menu" href="/ligningsvekt/">← Meny</a>
    <button class="btn-logout" onclick="doLogout()">Logg ut</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <div>
    <div class="page-title">📋 Aktive spillrom</div>
    <div class="page-sub">Oppdateres automatisk i sanntid</div>
  </div>

  <div class="toolbar">
    <label class="select-all-wrap">
      <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this.checked)">
      Velg alle
    </label>
    <button class="btn-danger" id="closeSelectedBtn" onclick="confirmCloseSelected()" disabled>
      🗑️ Avslutt valgte rom
    </button>
    <span class="rooms-count" id="roomsCount">Laster...</span>
  </div>

  <div id="roomList">
    <div class="loading">Henter rom...</div>
  </div>

</div>

<!-- FIREBASE -->
<script type="module">
  import { database, ref, onValue, remove } from "./js/firebase-config.js";
  window._db = database;
  window._ref = ref;
  window._onValue = onValue;
  window._remove = remove;
  window._fbReady = true;
</script>

<script>
// ── AUTH ──
const SESSION_KEY = 'teacher_token';
let authToken = sessionStorage.getItem(SESSION_KEY);

// Vis/skjul innlogging basert på token
if (authToken) {
  document.getElementById('loginScreen').style.display = 'none';
  initDashboard();
}

async function doLogin() {
  const pw = document.getElementById('passwordInput').value;
  if (!pw) return;

  const btn = document.querySelector('.btn-login');
  btn.textContent = 'Logger inn...'; btn.disabled = true;

  try {
    const res = await fetch('https://likningsspill.netlify.app/.netlify/functions/teacher-auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    });
    const data = await res.json();
    if (data.ok) {
      authToken = data.token;
      sessionStorage.setItem(SESSION_KEY, authToken);
      document.getElementById('loginScreen').style.display = 'none';
      initDashboard();
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  } catch (e) {
    document.getElementById('loginError').textContent = 'Tilkoblingsfeil – prøv igjen';
    document.getElementById('loginError').style.display = 'block';
  }
  btn.textContent = 'Logg inn'; btn.disabled = false;
}

function doLogout() {
  sessionStorage.removeItem(SESSION_KEY);
  location.reload();
}

// ── DASHBOARD ──
let roomsData  = {};     // { roomCode: { players: {...} } }
let openRooms  = new Set(); // hvilke rom er åpne/ekspandert
let selectedRooms = new Set();

function initDashboard() {
  if (!window._fbReady) {
    setTimeout(initDashboard, 200);
    return;
  }
  window._onValue(window._ref(window._db, 'rooms'), snap => {
    roomsData = snap.val() || {};
    renderRoomList();
  });
}

function relativeTime(ms) {
  if (!ms) return 'ukjent';
  const sec = Math.round((Date.now() - ms) / 1000);
  if (sec < 60)  return sec + ' sek siden';
  if (sec < 3600) return Math.floor(sec/60) + ' min siden';
  return Math.floor(sec/3600) + ' t siden';
}

function isActive(lastUpdated) {
  return lastUpdated && (Date.now() - lastUpdated) < 6*60*1000;
}

function renderRoomList() {
  const list = document.getElementById('roomList');
  const codes = Object.keys(roomsData);

  document.getElementById('roomsCount').textContent =
    codes.length === 0 ? 'Ingen aktive rom' :
    codes.length === 1 ? '1 aktivt rom' : codes.length + ' aktive rom';

  if (!codes.length) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="icon">🏁</div>
        <p>Ingen aktive rom</p>
        <small>Rom vises her når spillere kobler til med romkode</small>
      </div>`;
    return;
  }

  list.innerHTML = '';
  codes.sort().forEach(code => {
    const room = roomsData[code] || {};
    const players = room.players || {};
    const playerList = Object.entries(players);
    const count = playerList.length;

    // Finn leder og sist aktive
    const sorted = playerList.sort((a,b) => (b[1].score||0)-(a[1].score||0));
    const leader = sorted[0];
    const lastActive = Math.max(...playerList.map(([,p]) => p.lastUpdated||0));
    const isOpen = openRooms.has(code);
    const isSelected = selectedRooms.has(code);

    const card = document.createElement('div');
    card.className = `room-card${isSelected?' selected':''}`;
    card.id = 'room-'+code;

    // Medaljer
    const medals = ['🥇','🥈','🥉'];

    // Spillertabell
    const rows = sorted.map(([name, data], i) => {
      const active = isActive(data.lastUpdated);
      return `<tr class="${i===0?'is-leader':''}">
        <td><span class="pos-medal">${medals[i]||i+1+'.'}</span></td>
        <td>
          <span class="active-dot ${active?'active':'inactive'}"></span>
          ${name}
        </td>
        <td><span class="score-pill">${data.score||0} p</span></td>
        <td style="color:var(--muted);font-size:0.78rem">${relativeTime(data.lastUpdated)}</td>
      </tr>`;
    }).join('');

    card.innerHTML = `
      <div class="room-header" onclick="toggleRoom('${code}', event)">
        <input type="checkbox" class="room-check" ${isSelected?'checked':''}
               onclick="toggleSelect('${code}', event)">
        <div class="room-code">${code}</div>
        <div class="room-meta">
          <div class="room-player-count">${count} spiller${count!==1?'e':''}</div>
          <div class="room-last-active">Sist aktiv: ${relativeTime(lastActive)}</div>
          ${leader ? `<div class="room-leader">🏆 Leder: ${leader[0]} (${leader[1].score||0} p)</div>` : ''}
        </div>
        <div class="room-chevron ${isOpen?'open':''}">›</div>
      </div>
      <div class="room-detail ${isOpen?'open':''}">
        <table class="player-table">
          <thead>
            <tr>
              <th style="width:36px">#</th>
              <th>Spiller</th>
              <th>Poeng</th>
              <th>Sist aktiv</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="room-actions">
          <button class="btn-close-room" onclick="confirmCloseRoom('${code}')">
            🗑️ Avslutt dette rommet
          </button>
        </div>
      </div>`;

    list.appendChild(card);
  });

  updateCloseBtn();
}

function toggleRoom(code, event) {
  // Ikke toggle hvis klikk var på checkbox
  if (event.target.type === 'checkbox') return;
  if (openRooms.has(code)) openRooms.delete(code);
  else openRooms.add(code);
  renderRoomList();
}

function toggleSelect(code, event) {
  event.stopPropagation();
  if (selectedRooms.has(code)) selectedRooms.delete(code);
  else selectedRooms.add(code);
  updateCloseBtn();
  updateSelectAllCheckbox();
  // Oppdater bare dette kortet
  const card = document.getElementById('room-'+code);
  if (card) card.classList.toggle('selected', selectedRooms.has(code));
  const cb = card?.querySelector('.room-check');
  if (cb) cb.checked = selectedRooms.has(code);
}

function toggleSelectAll(checked) {
  const codes = Object.keys(roomsData);
  if (checked) codes.forEach(c => selectedRooms.add(c));
  else selectedRooms.clear();
  renderRoomList();
}

function updateSelectAllCheckbox() {
  const cb = document.getElementById('selectAll');
  const codes = Object.keys(roomsData);
  cb.checked = codes.length > 0 && codes.every(c => selectedRooms.has(c));
  cb.indeterminate = selectedRooms.size > 0 && selectedRooms.size < codes.length;
}

function updateCloseBtn() {
  const btn = document.getElementById('closeSelectedBtn');
  btn.disabled = selectedRooms.size === 0;
  btn.textContent = selectedRooms.size > 0
    ? `🗑️ Avslutt ${selectedRooms.size} valgte rom`
    : '🗑️ Avslutt valgte rom';
}

// ── CONFIRM / DELETE ──
let confirmCallback = null;

function showConfirm(title, text, onOk) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmText').textContent = text;
  confirmCallback = onOk;
  document.getElementById('confirmOverlay').classList.add('show');
  document.getElementById('confirmOkBtn').onclick = () => {
    closeConfirm(); onOk();
  };
}

function closeConfirm() {
  document.getElementById('confirmOverlay').classList.remove('show');
  confirmCallback = null;
}

function confirmCloseRoom(code) {
  showConfirm(
    `Avslutt rom ${code}?`,
    `Dette fjerner alle ${Object.keys(roomsData[code]?.players||{}).length} spillere fra rommet. Handlingen kan ikke angres.`,
    () => closeRoom(code)
  );
}

function confirmCloseSelected() {
  const count = selectedRooms.size;
  showConfirm(
    `Avslutt ${count} rom?`,
    `Dette fjerner alle spillere fra de ${count} valgte rommene. Handlingen kan ikke angres.`,
    () => {
      selectedRooms.forEach(code => closeRoom(code));
      selectedRooms.clear();
      updateCloseBtn();
    }
  );
}

async function closeRoom(code) {
  try {
    await window._remove(window._ref(window._db, 'rooms/'+code));
    openRooms.delete(code);
    showToast('✅ Rom '+code+' er avsluttet', 'success');
  } catch (e) {
    showToast('❌ Feil ved sletting av '+code, 'error');
  }
}

// ── TOAST ──
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast '+type;
  void t.offsetWidth; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── OPPDATER RELATIVE TIDER hvert 30. sek ──
setInterval(() => {
  if (Object.keys(roomsData).length) renderRoomList();
}, 30000);

// Enter-tast i passordfeltet
document.getElementById('passwordInput')?.addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
