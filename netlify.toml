[functions]
  directory = "netlify/functions"

[build]
  publish = "."

[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
 
# NYTT: hent de felles filene fra fellesrepoet.
# Slett mappen js/ i matematikkrepoet samtidig, ellers ligger det igjen en kopi
# som ikke brukes. force = true gjør at fellesfilene alltid vinner.
[[redirects]]
  from = "/js/*"
  to = "https://felles.netlify.app/js/:splat"
  status = 200
  force = true
