# Matematikksiden (likningsspill.netlify.app)
[build]
  publish = "."

# ai-proxy brukes fortsatt av Likningsbyggeren
[functions]
  directory = "netlify/functions"

[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# Felles filer hentes fra fellesrepoet. Adressen i nettleseren blir stående,
# så stiene i spillene kan fortsatt være ./js/... og ./baner/...
[[redirects]]
  from = "/js/*"
  to = "https://fellesting.netlify.app/js/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/baner/*"
  to = "https://fellesting.netlify.app/baner/:splat"
  status = 200
  force = true

# Lærersiden ligger i felles. Gamle bokmerker sendes videre dit.
[[redirects]]
  from = "/laerer.html"
  to = "https://fellesting.netlify.app/laerer.html"
  status = 301
  force = true

# Likningsspillene ligger nå i likninger/. Gamle lenker og bokmerker sendes videre.
[[redirects]]
  from = "/spill.html"
  to = "/likninger/spill.html"
  status = 301
  force = true

[[redirects]]
  from = "/balansevekt.html"
  to = "/likninger/balansevekt.html"
  status = 301
  force = true

[[redirects]]
  from = "/likningssett.html"
  to = "/likninger/likningssett.html"
  status = 301
  force = true

[[redirects]]
  from = "/likningsspill_tekst.html"
  to = "/likninger/likningsspill_tekst.html"
  status = 301
  force = true

# Koordinatslag ligger under funksjoner/. Gamle lenker sendes videre.
[[redirects]]
  from = "/koordinatslag.html"
  to = "/funksjoner/koordinatslag.html"
  status = 301
  force = true
