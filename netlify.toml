# Matematikksiden er flyttet til laerespill.netlify.app/matte/
# Alle gamle adresser og bokmerker sendes videre dit. Filene her brukes ikke lenger.
[build]
  publish = "."

[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# Lærersiden ligger i fellesting
[[redirects]]
  from = "/laerer.html"
  to = "https://fellesting.netlify.app/laerer.html"
  status = 301
  force = true

# Gamle stier fra før temamappene
[[redirects]]
  from = "/spill.html"
  to = "https://laerespill.netlify.app/matte/likninger/spill.html"
  status = 301
  force = true

[[redirects]]
  from = "/balansevekt.html"
  to = "https://laerespill.netlify.app/matte/likninger/balansevekt.html"
  status = 301
  force = true

[[redirects]]
  from = "/likningssett.html"
  to = "https://laerespill.netlify.app/matte/likninger/likningssett.html"
  status = 301
  force = true

[[redirects]]
  from = "/likningsspill_tekst.html"
  to = "https://laerespill.netlify.app/matte/likninger/likningsspill_tekst.html"
  status = 301
  force = true

[[redirects]]
  from = "/koordinatslag.html"
  to = "https://laerespill.netlify.app/matte/funksjoner/koordinatslag.html"
  status = 301
  force = true

# Alt annet: samme sti under /matte/
[[redirects]]
  from = "/*"
  to = "https://laerespill.netlify.app/matte/:splat"
  status = 301
  force = true
